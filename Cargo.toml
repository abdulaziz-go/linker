[workspace]
resolver = "2"
members = [
    "crates/linker-proto",
    "crates/linker-audio",
    "crates/linker-platform",
    "crates/linker-core",
    "crates/linker-linux",
    "crates/linker-macos",
    "crates/linker-daemon",
]
exclude = ["prototype"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
linker-proto = { path = "crates/linker-proto" }
linker-platform = { path = "crates/linker-platform" }
linker-core = { path = "crates/linker-core" }
linker-linux = { path = "crates/linker-linux", default-features = false }
linker-macos = { path = "crates/linker-macos" }
linker-audio = { path = "crates/linker-audio", default-features = false }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "signal", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sha2 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
libc = "0.2"

# libopus must run in real time even in debug builds (tests, `cargo run`).
[profile.dev.package.opusic-sys]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
